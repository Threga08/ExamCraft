<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExamCraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>ExamCraft</h1><p>Question Bank &amp; Randomized Test Generator</p></header>
  <main>
    <section class="panel">
      <h2>Add Question</h2>
      <form id="question-form" class="grid">
        <input name="questionText" placeholder="Question text" required class="wide">
        <input name="optionA" placeholder="Option A" required><input name="optionB" placeholder="Option B" required>
        <input name="optionC" placeholder="Option C" required><input name="optionD" placeholder="Option D" required>
        <select name="correctAnswer"><option>A</option><option>B</option><option>C</option><option>D</option></select>
        <input name="topic" placeholder="Topic" required>
        <select name="unitId" id="unit-select" required aria-label="Unit"><option value="">Select unit</option></select>
        <select name="difficulty"><option>EASY</option><option>MEDIUM</option><option>HARD</option></select>
        <button type="submit">Add Question</button>
      </form>
      <form id="unit-form" class="grid unit-form">
        <input name="unitName" placeholder="New unit name" required>
        <button type="submit">Add Unit</button>
      </form>
    </section>
    <section class="panel">
      <h2>Generate Test</h2>
      <form id="generate-form" class="grid">
        <input name="totalQuestions" type="number" min="1" placeholder="Total Questions" required>
        <input name="easyPercent" type="number" min="0" max="100" value="40" placeholder="Easy %" required>
        <input name="mediumPercent" type="number" min="0" max="100" value="40" placeholder="Medium %" required>
        <input name="hardPercent" type="number" min="0" max="100" value="20" placeholder="Hard %" required>
        <button type="submit">Generate Test</button>
      </form>
      <div id="generated" class="question-list"></div>
    </section>
    <section class="panel"><h2>Question Bank</h2><div id="bank" class="table-wrap"></div></section>
    <section class="panel"><h2>Attempt / Result</h2><form id="attempt-form" class="grid">
      <input name="studentName" placeholder="Student name" required><button type="submit">Submit Attempt</button>
    </form><div id="result" aria-live="polite"></div></section>
    <p id="message" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
